plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()

            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()

            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            )
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        name = "KosmX Maven"
        url = uri("https://maven.kosmx.dev/")
    }
}

dependencies {
    /*
     * PlayerAnimator reproduce las animaciones JSON.
     * Se mantiene como dependencia externa requerida.
     */
    implementation(
            "dev.kosmx.player-anim:player-animation-lib-forge:${player_anim_version}"
    )

    /*
     * Emotecraft 1.21.1 incluye BendyLib 5.1 dentro de su propio JAR.
     * Aquí hacemos lo mismo mediante Jar-in-Jar de ModDevGradle.
     *
     * NO es una dependencia externa que el usuario deba descargar.
     */
    jarJar(
            implementation(
                    "io.github.kosmx.bendy-lib:bendy-lib-forge"
            )
    ) {
        version {
            strictly "[5.1]"
            prefer "${bendy_lib_version}"
        }
    }
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            neo_version      : neo_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_version      : mod_version,
            mod_authors      : mod_authors,
            mod_description  : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}
